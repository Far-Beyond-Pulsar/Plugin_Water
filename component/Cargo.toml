[package]
name = "water_component"
version = "0.1.0"
edition = "2024"
description = "Water (pulsar.water): the water volume component, its rows, its row join and the plugin's Helio feature set (the water simulation and draw); the plugin's root crate registers them"

[lib]
name = "water_component"

[features]
# `#[derive(SceneStore)]` checks the deriving crate's own `gpu` feature.
default = ["gpu"]
gpu = []

[dependencies]
engine_class_derive = { workspace = true }
pulsar_reflection = { workspace = true, features = ["prims-gpui"] }
gpui-ce = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_scenedb_derive = { workspace = true }
pulsar_world_registry = { workspace = true }
pulsar_scene_model = { workspace = true }
helio_component = { workspace = true }
# The engine-class derive logs through it.
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
wgpu = { workspace = true }
helio = { workspace = true }
helio-feature-api = { workspace = true }
helio-scene-join = { workspace = true }
helio-foliage-api = { workspace = true }
helio-water-api = { workspace = true }
helio-pass-water-sim = { workspace = true }

[lints]
workspace = true
