[package]
name = "water_plugin"
version = "0.1.0"
edition = "2024"
publish = false
description = "Water (`pulsar.water`): the plugin's root crate, the one place it registers everything it contributes (runtime registrations always, the editor's with `editor`)"
# `examples/` is the plugin's examples crate, not this package's examples.
autoexamples = false

[features]
# The editor's registrations (the environment mixer's water volume) and the
# crates they need. A game links the root without it, so it takes no editor
# dependency.
editor = ["dep:water_editor", "dep:ui_level_editor"]

[dependencies]
# The plugin gate and the builder its registrations go through.
pulsar_plugins = { workspace = true }
# The plugin's crates.
water_component = { workspace = true }
water_editor = { workspace = true, optional = true }
# The engine seams the plugin registers into.
engine_backend = { path = "../../../crates/core/engine_backend", default-features = false, features = ["render"] }
pulsar_world_registry = { workspace = true }
# Level-record migrations (`pulsar_class::records`): the retired fields.
pulsar_class = { workspace = true }
# The editor's extension points.
ui_level_editor = { workspace = true, optional = true }

[dev-dependencies]
pulsar_scenedb = { workspace = true }
pulsar_scene_model = { workspace = true }
# The row join suite (`tests/scene_rows.rs`): the engine's join harness and
# the kinds whose rows the water reads (their roots register them).
helio = { workspace = true }
helio-core = { workspace = true }
helio-scene-join = { workspace = true }
helio-pass-water-sim = { workspace = true }
helio-light-api = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
pollster = "=0.4.0"
glam = { workspace = true }
meshes_component = { workspace = true }
meshes_plugin = { workspace = true }
lights_component = { workspace = true }
lights_plugin = { workspace = true }
foliage_component = { workspace = true }
foliage_plugin = { workspace = true }
# Bodies physics marks as pushing water (tests/scene_rows.rs).
physics_plugin = { workspace = true }
# The render graph node tests (`tests/graph_node.rs`).
helio-graph-asset = { workspace = true }
helio-presets = { workspace = true }

[lints]
workspace = true
